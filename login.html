<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desenvolve Business</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#edf1f5;color:#17243a;margin:0}header{background:#14243a;color:white;padding:24px}main{max-width:560px;margin:24px auto;padding:20px}section{background:white;padding:24px;border-radius:14px}input,select,button{font:inherit;padding:12px;width:100%;margin:8px 0;border:1px solid #aab7c5;border-radius:8px}button{background:#176bdb;color:white;cursor:pointer} [hidden]{display:none!important}</style><header>DESENVOLVE BUSINESS</header><main><p id="msg" role="status"></p><section id="auth"><h2>Acesso empresarial</h2><form id="login"><label>E-mail<input type="email" id="email" required autocomplete="email"></label><label>Senha<input type="password" id="pw" required minlength="8" autocomplete="current-password"></label><button>Entrar</button><button type="button" id="signup">Criar conta</button></form></section><section id="panel" hidden><h2>Minhas empresas</h2><p id="account"></p><ul id="companies"></ul><form id="company"><label>Nome da empresa<input id="name" required maxlength="150"></label><label>Segmento<select id="segment"><option value="automotivo">Automotivo</option><option value="alimentacao">Alimentação</option></select></label><button>Cadastrar empresa</button></form><button id="logout">Sair</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=id=>document.getElementById(id);const db=window.supabase.createClient('https://bwdigoqoicfxihhvzanq.supabase.co','sb_publishable_BJlYI9wmhLJpDAx8Lh1DAA_Gc9u32we');function msg(s){$('msg').textContent=s}async function refresh(){const {data,error}=await db.from('empresas').select('nome,segmento').order('criado_em');$('companies').replaceChildren();if(error)return msg(error.message);for(const x of data){const li=document.createElement('li');li.textContent=x.nome+' — '+x.segmento;$('companies').append(li)}}async function view(session){$('auth').hidden=!!session;$('panel').hidden=!session;if(session){$('account').textContent=session.user.email;await refresh()}}$('login').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('pw').value});msg(error?'Não foi possível entrar: '+error.message:'Login realizado.');};$('signup').onclick=async()=>{if(!$('login').reportValidity())return;const {error}=await db.auth.signUp({email:$('email').value,password:$('pw').value});msg(error?error.message:'Confira seu e-mail para confirmar o cadastro.');};$('company').onsubmit=async e=>{e.preventDefault();const {error}=await db.from('empresas').insert({nome:$('name').value.trim(),segmento:$('segment').value});if(error)return msg(error.message);$('company').reset();msg('Empresa cadastrada.');await refresh()};$('logout').onclick=async()=>{const {error}=await db.auth.signOut();msg(error?error.message:'Sessão encerrada.')};db.auth.onAuthStateChange((event,session)=>{setTimeout(()=>view(session),0)});
</script></html>
