<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desenvolve Business | Alimentação</title><style> *{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#14243a;font:16px system-ui}header{background:#14243a;color:white;padding:24px}main,nav{max-width:900px;margin:auto;padding:16px}section{background:white;padding:18px;border-radius:12px;margin:12px 0}button{background:#176bdb;color:white;border:0;border-radius:8px;padding:12px;margin:4px;cursor:pointer}input,select{padding:10px;border:1px solid #bbb;border-radius:6px;max-width:100%;margin:5px}label{display:block}h1{margin:0}small{color:#64748b}</style><header><h1>Desenvolve Business</h1>Alimentação • Protótipo local</header><nav><button onclick="render('admin')">Central</button><button onclick="render('edit')">Lanchonete</button><button onclick="render('menu')">Cardápio</button></nav><main id="app"></main><script>
const app=document.querySelector('#app'), money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let s=JSON.parse(localStorage.getItem('db-food-v1')||'null')||{name:'Lanchonete Exemplo',phone:'',active:true,extras:[{id:1,name:'Bacon',price:4},{id:2,name:'Queijo',price:3}],items:[{name:'X-Burger',desc:'Pão, carne e queijo',price:18,cat:'Lanches',extras:[1,2],active:true}],fee:5};let cart=[];function save(){localStorage.setItem('db-food-v1',JSON.stringify(s))}function render(v){if(v==='admin'){app.innerHTML=`<section><h2>Central administrativa</h2>${e(s.name)} • R$ 29,90/mês • ${s.active?'Ativa':'Suspensa'}<br><button onclick="s.active=!s.active;save();render('admin')">${s.active?'Suspender':'Reativar'}</button></section>`;return}if(!s.active){app.innerHTML='<section>Assinatura suspensa.</section>';return}if(v==='edit'){app.innerHTML=`<section><h2>Configurações</h2><form id="cfg"><label>Nome <input name="name" required value="${e(s.name)}"></label><label>WhatsApp (DDI + DDD) <input name="phone" value="${e(s.phone)}"></label><label>Taxa de entrega <input name="fee" type="number" min="0" step=".01" value="${s.fee}"></label><button>Salvar</button></form></section><section><h2>Adicionais compartilhados</h2>${s.extras.map((x,i)=>`<label>${e(x.name)} <input type="number" min="0" step=".01" value="${x.price}" onchange="s.extras[${i}].price=Number(this.value);save()"></label>`).join('')}<form id="extra"><input name="name" placeholder="Novo adicional" required><input name="price" type="number" min="0" step=".01" required placeholder="Preço"><button>Adicionar</button></form></section><section><h2>Cadastrar lanche</h2><form id="item"><input name="name" required placeholder="Nome"><input name="desc" placeholder="Ingredientes"><input name="cat" placeholder="Categoria"><input name="price" type="number" min="0" step=".01" required placeholder="Preço"><label>Foto (até 500 KB)<input type="file" name="photo" accept="image/*"></label>${s.extras.map(x=>`<label><input type="checkbox" name="extras" value="${x.id}">${e(x.name)}</label>`).join('')}<button>Publicar</button></form></section><section><h2>Meu cardápio</h2>${s.items.map((x,i)=>`<p>${e(x.name)} — ${money(x.price)} — ${x.active?'Disponível':'Esgotado'} <button onclick="s.items[${i}].active=!s.items[${i}].active;save();render('edit')">${x.active?'Marcar esgotado':'Disponibilizar'}</button></p>`).join('')}</section>`;document.querySelector('#cfg').onsubmit=a=>{a.preventDefault();let f=new FormData(a.target);s.name=f.get('name');s.phone=f.get('phone');s.fee=Number(f.get('fee'));save();render('edit')};document.querySelector('#extra').onsubmit=a=>{a.preventDefault();let f=new FormData(a.target);s.extras.push({id:Date.now(),name:f.get('name'),price:Number(f.get('price'))});save();render('edit')};document.querySelector('#item').onsubmit=async a=>{a.preventDefault();let f=new FormData(a.target),file=f.get('photo'),photo='';if(file.size>500000){alert('Foto muito grande');return}if(file.size)photo=await new Promise(r=>{let reader=new FileReader();reader.onload=()=>r(reader.result);reader.readAsDataURL(file)});s.items.push({name:f.get('name'),desc:f.get('desc'),cat:f.get('cat'),price:Number(f.get('price')),extras:f.getAll('extras').map(Number),active:true,photo});try{save()}catch{ s.items.pop();alert('Armazenamento cheio')}render('edit')};return}app.innerHTML=`<h2>${e(s.name)}</h2>${s.items.map((x,i)=>x.active?`<section>${x.photo?`<img style="max-width:100%;max-height:180px" src="${x.photo}">`:''}<small>${e(x.cat)}</small><h3>${e(x.name)} — ${money(x.price)}</h3><p>${e(x.desc)}</p>${s.extras.filter(z=>x.extras.includes(z.id)).map(z=>`<label><input type="checkbox" class="opt${i}" value="${z.id}">${e(z.name)} + ${money(z.price)}</label>`).join('')}<button onclick="add(${i})">Adicionar ao pedido</button></section>`:'').join('')}<section><h2>Seu pedido</h2>${cart.map((x,i)=>`<p>${e(x.name)} ${money(x.price)} <button onclick="cart.splice(${i},1);render('menu')">Remover</button></p>`).join('')}<p>Subtotal: ${money(cart.reduce((a,x)=>a+x.price,0))}</p><form id="order"><input name="name" required placeholder="Seu nome"><select name="mode" onchange="document.querySelector('#total').textContent=money(cart.reduce((a,x)=>a+x.price,0)+(this.value==='Entrega'?s.fee:0))"><option>Retirada</option><option>Entrega</option><option>Mesa</option></select><input name="address" placeholder="Endereço ou número da mesa"><p>Total: <b id="total">${money(cart.reduce((a,x)=>a+x.price,0))}</b></p><button>Enviar pelo WhatsApp</button></form></section>`;document.querySelector('#order').onsubmit=a=>{a.preventDefault();if(!cart.length)return alert('Adicione um lanche');if(!s.phone)return alert('Configure o WhatsApp da loja');let f=new FormData(a.target),total=cart.reduce((a,x)=>a+x.price,0)+(f.get('mode')==='Entrega'?s.fee:0);let msg=['Pedido de '+f.get('name'),...cart.map(x=>x.name+' — '+money(x.price)),f.get('mode')+' '+f.get('address'),'Total: '+money(total)].join('\n');window.open('https://wa.me/'+s.phone.replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank')}}function add(i){let x=s.items[i],extras=[...document.querySelectorAll('.opt'+i+':checked')].map(a=>s.extras.find(z=>z.id===Number(a.value)));cart.push({name:x.name+(extras.length?' + '+extras.map(z=>z.name).join(', '):''),price:x.price+extras.reduce((a,z)=>a+z.price,0)});render('menu')}render('edit');</script></html>
