<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desenvolve Business</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#f1f5f9;color:#17243a}header{background:#10243d;color:white;padding:24px}nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px;background:white}button{background:#176bdb;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer;font:inherit}main{max-width:1000px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card,form{background:white;border-radius:12px;padding:20px;margin-bottom:12px}input,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #b9c5d4;border-radius:6px}img{width:100%;max-height:200px;object-fit:cover}small{color:#64748b}a{color:#176bdb}h1{margin:0}label{display:block}</style>
<header><h1>Desenvolve Business</h1>Você cadastra. A tecnologia trabalha. Você vende.</header>
<nav>
<a href="index.html"><button>Automotivo</button></a>
<a href="alimentacao.html"><button>Alimentação</button></a>
</nav>
<nav>
<button onclick="show('admin')">Central administrativa</button><button onclick="show('merchant')">Meu negócio</button><button onclick="show('store')">Vitrine</button></nav><main id="app"></main><script>
let state=JSON.parse(localStorage.getItem('db-demo')||'null')||{name:'Auto Prime Veículos',phone:'',plan:'29,90',active:true,items:[]};let app=document.querySelector('#app');function save(){localStorage.setItem('db-demo',JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(page){if(page==='admin'){app.innerHTML=`<h2>Central administrativa</h2><div class="grid"><div class="card">Empresas de demonstração<h2>1</h2></div><div class="card">Receita simulada<h2>R$ ${state.active?state.plan:'0,00'}</h2></div></div><div class="card"><h3>${esc(state.name)}</h3><p>Plano: R$ ${state.plan} • ${state.active?'Ativo':'Suspenso'}</p><button onclick="state.active=!state.active;save();show('admin')">${state.active?'Suspender':'Reativar'}</button></div>`;return}if(!state.active){app.innerHTML='<h2>Assinatura suspensa</h2><p>Regularize sua assinatura para acessar os serviços.</p>';return}if(page==='merchant'){app.innerHTML=`<h2>Meu negócio</h2><form id="settings"><label>Nome da loja<input name="name" required value="${esc(state.name)}"></label><label>WhatsApp com DDI e DDD<input name="phone" value="${esc(state.phone)}"></label><label>Plano<select name="plan">${['29,90','59,90','99,90'].map(x=>`<option ${x===state.plan?'selected':''}>${x}</option>`).join('')}</select></label><button>Salvar configurações</button></form><form id="product"><h3>Cadastrar produto ou veículo</h3><input name="name" placeholder="Nome do produto" required><input name="price" type="number" min="0" step=".01" placeholder="Preço em reais" required><input name="desc" placeholder="Descrição, ano, detalhes"><label>Foto<input name="photo" type="file" accept="image/*"></label><button>Publicar</button></form><h3>Meu estoque</h3><div class="grid">${state.items.map((x,i)=>`<div class="card">${x.photo?`<img src="${x.photo}">`:''}<h3>${esc(x.name)}</h3><p>R$ ${esc(x.price)} • ${x.sold?'Vendido':'Disponível'}</p><button onclick="state.items[${i}].sold=!state.items[${i}].sold;save();show('merchant')">${x.sold?'Reativar':'Marcar vendido'}</button> <button onclick="state.items.splice(${i},1);save();show('merchant')">Excluir</button></div>`).join('')}</div>`;document.querySelector('#settings').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);for(let k of ['name','phone','plan'])state[k]=f.get(k);save();show('merchant')};document.querySelector('#product').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),file=f.get('photo'),photo='';if(file.size){if(file.size>1500000){alert('Use uma foto de até 1,5 MB nesta demonstração.');return}photo=await new Promise(r=>{let a=new FileReader();a.onload=()=>r(a.result);a.readAsDataURL(file)})}state.items.push({name:f.get('name'),price:f.get('price'),desc:f.get('desc'),photo,sold:false});try{save()}catch{state.items.pop();alert('Limite de armazenamento local atingido.')}show('merchant')};return}app.innerHTML=`<h2>${esc(state.name)}</h2><div class="grid">${state.items.filter(x=>!x.sold).map(x=>`<div class="card">${x.photo?`<img src="${x.photo}">`:''}<h3>${esc(x.name)}</h3><p>${esc(x.desc)}</p><h3>R$ ${esc(x.price)}</h3>${state.phone?`<a target="_blank" rel="noopener" href="https://wa.me/${state.phone.replace(/[^0-9]/g,'')}?text=${encodeURIComponent('Tenho interesse em '+x.name)}">Tenho interesse — WhatsApp</a>`:'<small>Configure o WhatsApp no painel.</small>'}</div>`).join('')||'Nenhum produto disponível.'}</div>`}show('merchant');</script></html>
